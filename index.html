<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jodaco</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .logo span {
      color: #4f7cff;
    }

    .tagline {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #888;
      font-weight: 400;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #4f7cff;
      margin: 2rem auto;
    }

    .coming-soon {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Joda<span>co</span></div>
    <p class="tagline">Web development, done right.</p>
    <div class="divider"></div>
    <p class="coming-soon">Something's coming soon</p>
  </div>
</body>
</html>
